<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-label="Mergulho Porto — Neptuno Dive, Porto de Galinhas PE">
  <defs>
    <linearGradient id="oceanBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="55%" stop-color="#134E8E"/>
      <stop offset="100%" stop-color="#0D8A94"/>
    </linearGradient>
    <linearGradient id="diverRed" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#F04438"/>
      <stop offset="100%" stop-color="#C8281D"/>
    </linearGradient>
    <linearGradient id="reefRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38D3DC"/>
      <stop offset="50%" stop-color="#F4D35E"/>
      <stop offset="100%" stop-color="#F04438"/>
    </linearGradient>
  </defs>

  <!-- Outer badge circle -->
  <circle cx="110" cy="110" r="104" fill="url(#oceanBg)"/>
  <circle cx="110" cy="110" r="97" fill="none" stroke="url(#reefRing)" stroke-width="2.5" stroke-opacity="0.88"/>
  <circle cx="110" cy="110" r="89" fill="none" stroke="#FFFDF9" stroke-width="1" stroke-dasharray="3 5" stroke-opacity="0.32"/>

  <!-- Subtle compass star at top-left (from official Neptuno sail emblem) -->
  <g transform="translate(52, 66)">
    <path d="M0 -15 L3.2 -3.2 L15 0 L3.2 3.2 L0 15 L-3.2 3.2 L-15 0 L-3.2 -3.2 Z" fill="#38D3DC" opacity="0.92"/>
    <path d="M-8 -8 L0 -2 L8 -8 L2 0 L8 8 L0 2 L-8 8 L-2 0 Z" fill="#FFFDF9" opacity="0.75"/>
    <circle cx="0" cy="0" r="2.2" fill="#0B2545"/>
  </g>

  <!-- Red Scuba Diver Silhouette with Tank, Mask & Fins (from official Neptuno Dive logo) -->
  <g transform="translate(0, -4)">
    <!-- Scuba Tank on back -->
    <rect x="86" y="54" width="34" height="10.5" rx="5.2" transform="rotate(-8 103 59)" fill="#FFFDF9" opacity="0.95"/>
    <circle cx="122" cy="56" r="3.5" fill="#38D3DC"/>
    <!-- Regulator hose -->
    <path d="M123 56 C132 51, 142 54, 145 62" fill="none" stroke="#38D3DC" stroke-width="2" stroke-linecap="round"/>

    <!-- Diver body & fins in iconic Neptuno red -->
    <path d="M148 63
             C154 63, 159 68, 159 74
             C159 80, 154 84, 148 84
             C144 84, 141 82, 139 79
             L166 87
             C170 88, 172 91, 171 94
             C170 97, 166 98, 162 97
             L132 87
             L105 91
             L75 103
             L52 114
             L36 121
             L46 108
             L69 95
             L94 82
             L64 81
             L42 86
             L30 82
             L47 73
             L74 72
             L103 71
             C114 69, 126 68, 136 71
             C138 66, 143 63, 148 63 Z"
          fill="url(#diverRed)"/>

    <!-- Dive Mask Visor Highlight -->
    <rect x="149" y="69" width="9" height="6" rx="2.5" fill="#38D3DC"/>
    <!-- Air bubbles rising -->
    <circle cx="164" cy="59" r="3" fill="#FFFDF9" opacity="0.85"/>
    <circle cx="171" cy="50" r="4.2" fill="#38D3DC" opacity="0.9"/>
    <circle cx="163" cy="41" r="2.2" fill="#FFFDF9" opacity="0.7"/>
  </g>

  <!-- Reef wave divider -->
  <path d="M40 124 Q75 116 110 124 T180 124" fill="none" stroke="#38D3DC" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Wordmark: MERGULHO PORTO / NEPTUNO DIVE -->
  <text x="110" y="148" text-anchor="middle" fill="#FFFDF9" font-family="'Space Grotesk', 'Syne', sans-serif" font-weight="800" font-size="19.5" letter-spacing="1.2">MERGULHO PORTO</text>
  <rect x="64" y="157" width="92" height="19" rx="9.5" fill="url(#diverRed)"/>
  <text x="110" y="170.5" text-anchor="middle" fill="#FFFDF9" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" letter-spacing="2.6">NEPTUNO DIVE</text>
  <text x="110" y="191" text-anchor="middle" fill="#A6E9EE" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" letter-spacing="2.2">PORTO DE GALINHAS · PE</text>
</svg>
